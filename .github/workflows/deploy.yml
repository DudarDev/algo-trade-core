name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/quantum-terminal-pro
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Test Suite
        run: pytest -v

  deploy:
    name: Deploy to Server via SSH
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Execute SSH Deploy Script
        uses: appleboy/ssh-action@v1.0.3
        continue-on-error: true
        with:
          host: ${{ secrets.SERVER_HOST || secrets.SERVER_IP || '79.76.113.101' }}
          username: ${{ secrets.SERVER_USER || 'ubuntu' }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          script: |
            bash ~/algo-trade-core/infrastructure/deploy.sh
