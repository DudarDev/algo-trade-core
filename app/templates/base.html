<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantum Scalper Pro</title>
    
    <!-- CDNs -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <!-- Fonts: Inter (UI) & JetBrains Mono (Data/Code) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* PRO TRADING THEME */
        :root {
            --bg-dark: #0b0e11;
            --bg-panel: #151a1e;
            --border-color: #2a2e39;
            --text-primary: #eaecef;
            --text-secondary: #848e9c;
            --accent-green: #0ecb81;
            --accent-red: #f6465d;
            --accent-blue: #3b82f6;
        }

        body { 
            background-color: var(--bg-dark);
            color: var(--text-primary); 
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
        }

        /* DATA FONT */
        .mono-font {
            font-family: 'JetBrains Mono', monospace;
        }

        /* PANEL STYLING */
        .pro-panel {
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 4px;
        }

        /* NAVBAR STYLING */
        .pro-nav {
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border-color);
            height: 60px;
        }

        /* LIVE INDICATOR (Subtle Pulse) */
        .status-dot {
            width: 8px; height: 8px;
            background-color: var(--accent-green);
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.7);
            animation: pulse-pro 2s infinite;
        }

        @keyframes pulse-pro {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 203, 129, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(14, 203, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(14, 203, 129, 0); }
        }

        /* UTILITIES */
        .text-accent { color: var(--accent-blue); }
        .text-profit { color: var(--accent-green); }
        .text-loss { color: var(--accent-red); }
        .text-muted { color: var(--text-secondary); }

        /* OVERRIDES for Tailwind classes in content */
        .bg-white { background-color: var(--bg-panel) !important; color: var(--text-primary) !important; border: 1px solid var(--border-color); }
        .text-gray-900 { color: var(--text-primary) !important; }
        .text-gray-500, .text-gray-600 { color: var(--text-secondary) !important; }
        .shadow-sm, .shadow-md, .shadow-lg { box-shadow: none !important; } /* Flat design for pro feel */
    </style>
</head>
<body class="antialiased">

    <!-- NAVBAR -->
    <nav class="pro-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-full">
            <div class="flex justify-between items-center h-full">
                
                <!-- LOGO & BRAND -->
                <div class="flex items-center gap-4">
                    <div class="flex items-center justify-center w-8 h-8 bg-blue-600/10 rounded border border-blue-500/30">
                        <i class="fa-solid fa-layer-group text-blue-500 text-sm"></i>
                    </div>
                    
                    <div class="flex flex-col justify-center">
                        <span class="text-base font-semibold tracking-wide text-gray-100 uppercase">
                            Quantum Scalper <span class="text-blue-500 text-xs align-top">PRO</span>
                        </span>
                    </div>

                    <div class="ml-8 hidden md:flex items-center gap-2 px-3 py-1 bg-[#1e2329] rounded border border-[#2a2e39]">
                        <span class="status-dot"></span>
                        <span class="text-xs font-medium text-gray-300 mono-font">SYSTEM ONLINE</span>
                    </div>
                </div>

                <!-- METRICS STRIP -->
                <div class="hidden md:flex items-center space-x-6 text-xs mono-font">
                    <div class="flex flex-col items-end">
                        <span class="text-muted uppercase">Server</span>
                        <span class="text-gray-200">e2-medium</span>
                    </div>
                    <div class="h-8 w-px bg-[#2a2e39]"></div>
                    <div class="flex flex-col items-end">
                        <span class="text-muted uppercase">Latency</span>
                        <span class="text-profit">1ms</span>
                    </div>
                    <div class="h-8 w-px bg-[#2a2e39]"></div>
                    <div class="flex flex-col items-end">
                        <span class="text-muted uppercase">Ver</span>
                        <span class="text-blue-400">v6.7</span>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- MAIN CONTENT -->
    <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
        <!-- Breadcrumb / Status Bar could go here -->
        
        {% block content %}
        {% endblock %}
    </div>

    <!-- FOOTER -->
    <footer class="border-t border-[#2a2e39] mt-8 py-6">
        <div class="max-w-7xl mx-auto px-4 text-center text-xs text-secondary mono-font">
            <p class="mb-2">QUANTUM ALGORITHMIC TRADING CORE • <span class="text-gray-500">PROPRIETARY SOFTWARE</span></p>
            <p class="text-[10px] text-gray-600">ID: 480920 • US-CENTRAL1-A</p>
        </div>
    </footer>

</body>
</html>
