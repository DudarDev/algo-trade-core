version: '3.3'

services:
  bot:
    image: us-central1-docker.pkg.dev/algo-trade-480920/bot-repo/ai-scalper:v2
    container_name: bot
    restart: always
    volumes:
      - ./bot_data:/app/bot_data
      - ./bot_data:/app/data
    command: python main.py

  website:
    image: us-central1-docker.pkg.dev/algo-trade-480920/bot-repo/ai-scalper:v2
    container_name: website
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - bot
    volumes:
      - ./bot_data:/app/bot_data
      - ./bot_data:/app/data
    command: python manage.py runserver 0.0.0.0:8000