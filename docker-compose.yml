version: '3.8'

services:
  # --- СЕРВІС 1: ТОРГОВИЙ БОТ ---
  trading-bot:
    build: .
    container_name: algo_sniper
    restart: always
    env_file:
      - .env
    volumes:
      - ./data:/app/data  # Спільна папка з БД
      - ./logs:/app/logs
    command: python main.py
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # --- СЕРВІС 2: WEB DASHBOARD (Django) ---
  dashboard:
    build: .
    container_name: algo_web
    restart: always
    env_file:
      - .env
    ports:
      - "8080:8000"       # Прокидаємо порт 8080 (Cloud Shell любить 8080)
    volumes:
      - ./data:/app/data  # Та сама папка, щоб читати bot_data.db!
      - ./logs:/app/logs
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    depends_on:
      - trading-bot