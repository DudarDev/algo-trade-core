version: '3.8'

services:
  bot:
    build: .
    container_name: algo_sniper
    restart: unless-stopped
    command: python main.py
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data     # <--- ЗМІНИЛИ ТУТ
    env_file:
      - .env

  web:
    build: .
    container_name: algo_web
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data     # <--- І ЗМІНИЛИ ТУТ
    env_file:
      - .env