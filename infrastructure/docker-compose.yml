version: '3.8'

services:
  engine:
    build:
      context: ../  # Контекст збірки — корінь проєкту
      dockerfile: infrastructure/docker/engine.Dockerfile
    container_name: algo_engine
    restart: unless-stopped
    command: python main.py
    volumes:
      # Правильні шляхи до нової структури
      - ../logs:/app/logs
      - ../data_storage:/app/data_storage
    env_file:
      - ../.env

  web_panel:
    build:
      context: .
      dockerfile: infrastructure/engine.Dockerfile
    container_name: algo_web
    working_dir: /app/src    # <--- ДОДАЙ ЦЕЙ РЯДОК
    command: gunicorn web_panel.wsgi:application --bind 0.0.0.0:8000 # <--- ПРИБЕРИ ВСІ ЗАЙВІ src. звідси
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - engine