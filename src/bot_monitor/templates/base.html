<!DOCTYPE html>
<html lang="uk" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoTrade Pro • Apple Cupertino Quant Terminal</title>
    
    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 Pro CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Inter"', 'sans-serif'],
                        mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace'],
                    },
                    colors: {
                        apple: {
                            base: '#07080a',
                            surface: '#0d0f15',
                            card: '#12151e',
                            cardHover: '#171b26',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.14)',
                            green: '#30D158',
                            greenHover: '#28bd4d',
                            red: '#FF453A',
                            redHover: '#e0382e',
                            blue: '#0A84FF',
                            blueHover: '#0070e0',
                            orange: '#FF9F0A',
                            purple: '#BF5AF2',
                            teal: '#64D2FF',
                            muted: '#86868b'
                        },
                        brand: {
                            dark: '#07080a',
                            surface: '#0d0f15',
                            panel: '#12151e',
                            border: 'rgba(255, 255, 255, 0.08)',
                            borderLight: 'rgba(255, 255, 255, 0.14)',
                            accent: '#30D158',
                            accentHover: '#28bd4d',
                            danger: '#FF453A',
                            dangerHover: '#e0382e',
                            warn: '#FF9F0A',
                            info: '#0A84FF',
                            purple: '#BF5AF2'
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            background-color: #060709;
            background-image: 
                radial-gradient(ellipse 90% 60% at 50% -25%, rgba(10, 132, 255, 0.07), transparent 70%),
                radial-gradient(ellipse 70% 50% at 85% 10%, rgba(48, 209, 88, 0.04), transparent 60%),
                radial-gradient(ellipse 60% 40% at 15% 90%, rgba(191, 90, 242, 0.03), transparent 60%);
            color: #f5f5f7;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Apple ultra-refined scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.16);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.28);
        }

        .mono-num {
            font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
            font-feature-settings: 'tnum' on, 'zero' on;
        }

        /* Cupertino frosted glass panel */
        .glass-panel {
            background: rgba(14, 17, 24, 0.76);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            box-shadow: 
                inset 0 1px 0 0 rgba(255, 255, 255, 0.07),
                0 12px 36px -8px rgba(0, 0, 0, 0.55);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: rgba(255, 255, 255, 0.12);
        }

        /* Apple segmented control tab */
        .apple-seg-container {
            background: rgba(255, 255, 255, 0.05);
            padding: 3px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.07);
            display: inline-flex;
            gap: 2px;
        }
        .apple-seg-item {
            padding: 4px 12px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            color: #86868b;
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-seg-item:hover {
            color: #f5f5f7;
        }
        .apple-seg-item.active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        /* Skeleton shimmer */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.03) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Toast notifications */
        .toast {
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .toast-success {
            background: rgba(48, 209, 88, 0.16);
            color: #30D158;
            border-color: rgba(48, 209, 88, 0.3);
        }
        .toast-error {
            background: rgba(255, 69, 58, 0.16);
            color: #FF453A;
            border-color: rgba(255, 69, 58, 0.3);
        }
        .toast-info {
            background: rgba(10, 132, 255, 0.16);
            color: #0A84FF;
            border-color: rgba(10, 132, 255, 0.3);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="flex-1 w-full max-w-[1760px] mx-auto px-3 sm:px-6 py-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
