<!DOCTYPE html>
<html lang="uk" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoTrade Pro • Apple Cupertino Quant Terminal</title>
    
    <!-- Favicon SVG -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">

    <!-- Anti-FOUC Theme Init Script -->
    <script>
        (function() {
            try {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark') {
                    document.documentElement.classList.remove('light');
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                }
            } catch (e) {}
        })();
    </script>

    <!-- Fonts: Inter + JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome 6 Pro CDN -->
    <!-- FontAwesome 6 Pro CDN + Fast CDN Fallback -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.1/css/all.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', '"Inter"', 'sans-serif'],
                        mono: ['"SF Mono"', '"JetBrains Mono"', 'Menlo', 'monospace'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --apple-bg: #f5f5f7;
            --apple-bg-gradient: radial-gradient(ellipse 90% 60% at 50% -20%, rgba(0, 122, 255, 0.05), transparent 70%),
                                 radial-gradient(ellipse 70% 50% at 85% 10%, rgba(52, 199, 89, 0.04), transparent 60%);
            --apple-text: #1d1d1f;
            --apple-text-secondary: #6e6e73;
            --apple-text-muted: #86868b;
            --apple-panel-bg: rgba(255, 255, 255, 0.86);
            --apple-panel-border: rgba(0, 0, 0, 0.08);
            --apple-panel-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05), 0 1px 3px 0 rgba(0, 0, 0, 0.02);
            --apple-subtle-bg: rgba(0, 0, 0, 0.04);
            --apple-subtle-hover: rgba(0, 0, 0, 0.07);
            --apple-seg-bg: rgba(0, 0, 0, 0.06);
            --apple-seg-active: #ffffff;
            --apple-seg-active-text: #1d1d1f;
            --apple-seg-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            --apple-divider: rgba(0, 0, 0, 0.06);
            
            --apple-green: #34C759;
            --apple-green-text: #248a3d;
            --apple-green-bg: rgba(52, 199, 89, 0.12);
            --apple-green-border: rgba(52, 199, 89, 0.28);
            
            --apple-red: #FF3B30;
            --apple-red-text: #d70015;
            --apple-red-bg: rgba(255, 59, 48, 0.12);
            --apple-red-border: rgba(255, 59, 48, 0.28);
            
            --apple-blue: #007AFF;
            --apple-blue-text: #0062cc;
            --apple-blue-bg: rgba(0, 122, 255, 0.12);
            --apple-blue-border: rgba(0, 122, 255, 0.28);
            
            --apple-orange: #FF9500;
            --apple-orange-text: #b25000;
            --apple-orange-bg: rgba(255, 149, 0, 0.12);
            
            --apple-modal-bg: rgba(255, 255, 255, 0.96);
            --apple-modal-border: rgba(0, 0, 0, 0.1);
        }

        html.dark {
            --apple-bg: #060709;
            --apple-bg-gradient: radial-gradient(ellipse 90% 60% at 50% -25%, rgba(10, 132, 255, 0.07), transparent 70%),
                                 radial-gradient(ellipse 70% 50% at 85% 10%, rgba(48, 209, 88, 0.04), transparent 60%),
                                 radial-gradient(ellipse 60% 40% at 15% 90%, rgba(191, 90, 242, 0.03), transparent 60%);
            --apple-text: #f5f5f7;
            --apple-text-secondary: #86868b;
            --apple-text-muted: #636366;
            --apple-panel-bg: rgba(14, 17, 24, 0.78);
            --apple-panel-border: rgba(255, 255, 255, 0.08);
            --apple-panel-shadow: inset 0 1px 0 0 rgba(255, 255, 255, 0.07), 0 12px 36px -8px rgba(0, 0, 0, 0.55);
            --apple-subtle-bg: rgba(255, 255, 255, 0.04);
            --apple-subtle-hover: rgba(255, 255, 255, 0.08);
            --apple-seg-bg: rgba(255, 255, 255, 0.05);
            --apple-seg-active: rgba(255, 255, 255, 0.14);
            --apple-seg-active-text: #ffffff;
            --apple-seg-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
            --apple-divider: rgba(255, 255, 255, 0.06);
            
            --apple-green: #30D158;
            --apple-green-text: #30D158;
            --apple-green-bg: rgba(48, 209, 88, 0.15);
            --apple-green-border: rgba(48, 209, 88, 0.3);
            
            --apple-red: #FF453A;
            --apple-red-text: #FF453A;
            --apple-red-bg: rgba(255, 69, 58, 0.15);
            --apple-red-border: rgba(255, 69, 58, 0.3);
            
            --apple-blue: #0A84FF;
            --apple-blue-text: #0A84FF;
            --apple-blue-bg: rgba(10, 132, 255, 0.15);
            --apple-blue-border: rgba(10, 132, 255, 0.3);
            
            --apple-orange: #FF9F0A;
            --apple-orange-text: #FF9F0A;
            --apple-orange-bg: rgba(255, 159, 10, 0.15);
            
            --apple-modal-bg: rgba(15, 18, 26, 0.96);
            --apple-modal-border: rgba(255, 255, 255, 0.12);
        }

        /* ======================================================== */
        /* RESILIENT CORE CSS (Works offline, with adblockers & no-CDN) */
        /* ======================================================== */
        .flex { display: flex; }
        .inline-flex { display: inline-flex; }
        .flex-col { flex-direction: column; }
        .flex-wrap { flex-wrap: wrap; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-between { justify-content: space-between; }
        .justify-center { justify-content: center; }
        .flex-1 { flex: 1 1 0%; }
        .grid { display: grid; }
        .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }

        @media (min-width: 640px) {
            .sm\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .sm\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        }
        @media (min-width: 1024px) {
            .lg\:grid-cols-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        }
        @media (min-width: 1280px) {
            .xl\:flex { display: flex; }
        }

        .gap-1 { gap: 0.25rem; }
        .gap-1\.5 { gap: 0.375rem; }
        .gap-2 { gap: 0.5rem; }
        .gap-2\.5 { gap: 0.625rem; }
        .gap-3 { gap: 0.75rem; }
        .gap-3\.5 { gap: 0.875rem; }
        .gap-4 { gap: 1rem; }
        .gap-5 { gap: 1.25rem; }

        .p-2 { padding: 0.5rem; }
        .p-3 { padding: 0.75rem; }
        .p-3\.5 { padding: 0.875rem; }
        .p-4 { padding: 1rem; }
        .p-5 { padding: 1.25rem; }
        .px-2 { padding-left: 0.5rem; padding-right: 0.5rem; }
        .px-2\.5 { padding-left: 0.625rem; padding-right: 0.625rem; }
        .px-3 { padding-left: 0.75rem; padding-right: 0.75rem; }
        .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
        .px-4 { padding-left: 1rem; padding-right: 1rem; }
        .px-5 { padding-left: 1.25rem; padding-right: 1.25rem; }
        .py-0\.5 { padding-top: 0.125rem; padding-bottom: 0.125rem; }
        .py-1 { padding-top: 0.25rem; padding-bottom: 0.25rem; }
        .py-1\.5 { padding-top: 0.375rem; padding-bottom: 0.375rem; }
        .py-2 { padding-top: 0.5rem; padding-bottom: 0.5rem; }
        .py-3\.5 { padding-top: 0.875rem; padding-bottom: 0.875rem; }

        .mb-2 { margin-bottom: 0.5rem; }
        .mb-3 { margin-bottom: 0.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-5 { margin-bottom: 1.25rem; }
        .mt-1 { margin-top: 0.25rem; }

        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .rounded-full { border-radius: 9999px; }

        .border { border-width: 1px; border-style: solid; }
        .border-b { border-bottom-width: 1px; border-bottom-style: solid; }
        .border-l { border-left-width: 1px; border-left-style: solid; }
        .relative { position: relative; }
        .absolute { position: absolute; }
        .overflow-hidden { overflow: hidden; }
        .w-full { width: 100%; }
        .text-right { text-align: right; }
        .text-center { text-align: center; }

        .text-\[9px\] { font-size: 9px; }
        .text-\[10px\] { font-size: 10px; }
        .text-\[11px\] { font-size: 11px; }
        .text-xs { font-size: 12px; }
        .text-sm { font-size: 14px; }
        .text-base { font-size: 16px; }
        .text-lg { font-size: 18px; }
        .text-xl { font-size: 20px; }
        .text-2xl { font-size: 24px; }

        .font-bold { font-weight: 700; }
        .font-semibold { font-weight: 600; }
        .font-medium { font-weight: 500; }
        .font-mono { font-family: "SF Mono", "JetBrains Mono", Menlo, monospace; }
        .uppercase { text-transform: uppercase; }
        .tracking-wider { letter-spacing: 0.05em; }
        .tracking-tight { letter-spacing: -0.025em; }
        .transition-all { transition-property: all; transition-duration: 200ms; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", sans-serif;
            background-color: var(--apple-bg);
            background-image: var(--apple-bg-gradient);
            color: var(--apple-text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Apple refined scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(120, 120, 128, 0.25);
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(120, 120, 128, 0.45);
        }

        .mono-num {
            font-family: "SF Mono", "JetBrains Mono", Menlo, monospace;
            font-feature-settings: 'tnum' on, 'zero' on;
        }

        /* Cupertino frosted glass panel */
        .glass-panel {
            background: var(--apple-panel-bg);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid var(--apple-panel-border);
            border-radius: 18px;
            box-shadow: var(--apple-panel-shadow);
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .glass-panel:hover {
            border-color: rgba(120, 120, 128, 0.2);
        }

        /* Apple segmented control tab */
        .apple-seg-container {
            background: var(--apple-seg-bg);
            padding: 3px;
            border-radius: 12px;
            border: 1px solid var(--apple-panel-border);
            display: inline-flex;
            gap: 2px;
        }
        .apple-seg-item {
            padding: 4px 12px;
            border-radius: 9px;
            font-size: 11px;
            font-weight: 600;
            color: var(--apple-text-secondary);
            transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .apple-seg-item:hover {
            color: var(--apple-text);
        }
        .apple-seg-item.active {
            background: var(--apple-seg-active);
            color: var(--apple-seg-active-text);
            box-shadow: var(--apple-seg-shadow);
        }

        /* Skeleton shimmer */
        .skeleton {
            background: linear-gradient(90deg, rgba(120,120,128,0.06) 25%, rgba(120,120,128,0.15) 50%, rgba(120,120,128,0.06) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.8s infinite;
            border-radius: 6px;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Toast notifications */
        .toast {
            opacity: 0;
            transform: translateY(10px) scale(0.96);
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            padding: 10px 16px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
        .toast-success {
            background: var(--apple-green-bg);
            color: var(--apple-green-text);
            border: 1px solid var(--apple-green-border);
        }
        .toast-error {
            background: var(--apple-red-bg);
            color: var(--apple-red-text);
            border: 1px solid var(--apple-red-border);
        }
        .toast-info {
            background: var(--apple-blue-bg);
            color: var(--apple-blue-text);
            border: 1px solid var(--apple-blue-border);
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
    <div class="flex-1 w-full max-w-[1760px] mx-auto px-3 sm:px-6 py-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
